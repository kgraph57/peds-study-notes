<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="小児科専門医試験のための、出典とライセンスを確認できる実画像アトラス。">
  <title>小児科画像アトラス | Pediatric Image Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171918'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='12' fill='%23f4f2ed'%3EPA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="atlas.css?v=20260731l">
  <script defer src="atlas.js?v=20260731l"></script>
</head>
<body data-page="index">
  <header class="site-header">
    <a class="brand" href="/atlas/"><span class="brand-mark">PA</span><span>小児科画像アトラス<small>Pediatric Image Atlas</small></span></a>
    <div class="header-actions"><a class="back-link" href="/">学習ノートへ</a><button id="site-theme-toggle" type="button" aria-label="表示テーマを切り替える">🌙</button></div>
  </header>
  <main class="flash-review">
    <header class="flash-review__intro">
      <div>
        <p class="atlas-masthead__label">FLASH REVIEW</p>
        <h1>見て、思い出す。</h1>
        <p>覚えていない画像だけを、1枚ずつ。答えを確認したら「もう一度」か「覚えた」を選びます。</p>
      </div>
      <div class="flash-progress" aria-label="学習進捗">
        <p><strong id="remaining-count">—</strong><span>枚のこり</span></p>
        <div><span>覚えた <b id="learned-count">0</b></span><span>もう一度 <b id="shaky-count">0</b></span></div>
        <span class="learning-progress__track"><i id="learning-progress-bar"></i></span>
      </div>
    </header>
    <section class="flash-stage" id="flashcard-root" aria-live="polite"></section>
  </main>
  <footer class="atlas-footer">
    <p>専門医試験対策の学習教材です。診療判断には使用せず、原典と最新ガイドラインを確認してください。</p>
    <div><a href="/data/atlas/image-license-audit.json">画像と出典について</a></div>
  </footer>
</body>
</html>
